plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.soft.anyi'
    compileSdk 34

    defaultConfig {
        applicationId 'com.soft.anyi'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0-native'
    }

    signingConfigs {
        release {
            def ks = file('keystore.jks')
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('ANDROID_STORE_PASSWORD') ?: 'bm666...'
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'ayrjh'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'bm666...'
            }
        }
        // 本地无签名文件时的兜底（CI 上一定走上面 release）
        debugSig {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debugSig
        }
        debug {
            // ★ 与 Flutter 版一致：debug 不加后缀，保证本机可直接覆盖调试安装
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    // 网络
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20240303'
    // 图片
    implementation 'io.coil-kt:coil:2.6.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // 音视频
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // 存储
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    // 下拉刷新/轮播
    implementation 'io.github.youth5201314:banner:2.2.3'
    // 二维码
    implementation 'com.google.zxing:core:3.5.3'
}
